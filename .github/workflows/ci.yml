name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.lock
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Released-model CPU smoke (training fixture)
        run: python -m pytest tests/test_released_model_smoke.py
      - name: Remaining test suite
        run: python -m pytest --ignore=tests/test_released_model_smoke.py
